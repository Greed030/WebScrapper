[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "web-scraper"
version = "0.1.0"
description = "Универсальный скрапер-инструмент для AI-агента: search / fetch / extract / crawl"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "selectolax>=1.0",
    "lxml>=5.2",
    "cssselect>=1.2",
    "trafilatura>=2.0",
    "playwright>=1.45",
    "pydantic>=2.11",
    "pyyaml>=6.0",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "jsonschema>=4.21",
    "phonenumbers>=8.13",
]

[project.optional-dependencies]
anthropic = ["anthropic>=1.0"]
openai = ["openai>=1.40"]
mcp = ["mcp>=2.0"]
all = ["anthropic>=1.0", "openai>=1.40", "mcp>=2.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21"]

[project.scripts]
web-scraper = "web_scraper.cli:main"

[tool.setuptools.packages.find]
include = ["web_scraper*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["browser: нужен установленный Chromium (python -m playwright install chromium)"]
addopts = "-m 'not browser'"
